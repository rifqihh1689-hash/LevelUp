<title>MBAPPE OS</title>
<style>
:root{
  --bg:#0a0e14;--bg2:#0f141c;--card:#131a24;--card2:#1a2330;--line:#222d3c;--line2:#2c3a4d;
  --text:#e7edf5;--muted:#8b98a9;--dim:#566376;
  --accent:#8ea6ff;--good:#3ddc97;--bad:#ff6b6b;--warn:#f5c451;--info:#7cc4ff;
  --VIT:#3ddc97;--STR:#ff8a5c;--INT:#5aa9ff;--RSC:#b794ff;--GLD:#f5c451;--CHA:#ff8fc7;
  --NORMAL:#2dd4bf;--JAGA:#a78bfa;--PASCA:#60a5fa;--LIBUR:#fbbf24;
  --r:14px;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom));scroll-padding-top:90px}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:560px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
h1{font-size:21px;line-height:1.2;letter-spacing:-.01em}
h2{font-size:16px;line-height:1.3}
h3{font-size:14px}
p{margin:6px 0}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.tiny{font-size:11.5px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);font-weight:650;font-size:14.5px;text-align:center}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:#0a0e14;border-color:transparent}
.btn.danger{background:rgba(255,107,107,.1);color:var(--bad);border-color:rgba(255,107,107,.35)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%;margin-top:8px}
.btn:disabled{opacity:.45}
.btn.locked{color:var(--muted);border-style:dashed}
.x{width:40px;height:40px;border-radius:10px;font-size:18px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.chip.warn{color:var(--warn);background:rgba(245,196,81,.12)}
.chip.good{color:var(--good);background:rgba(61,220,151,.12)}
.chip.bad{color:var(--bad);background:rgba(255,107,107,.12)}
.s-VIT{color:var(--VIT);background:rgba(61,220,151,.12)}.s-STR{color:var(--STR);background:rgba(255,138,92,.13)}.s-INT{color:var(--INT);background:rgba(90,169,255,.13)}.s-RSC{color:var(--RSC);background:rgba(183,148,255,.14)}.s-GLD{color:var(--GLD);background:rgba(245,196,81,.13)}.s-CHA{color:var(--CHA);background:rgba(255,143,199,.13)}
.tc-NORMAL{color:var(--NORMAL)}.tc-JAGA{color:var(--JAGA)}.tc-PASCA{color:var(--PASCA)}.tc-LIBUR{color:var(--LIBUR)}
/* banner */
.banner{background:#3b1c1f;color:#ffd9d9;padding:10px 16px;font-size:13px;border-bottom:1px solid #6d2c31;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner .btn{min-height:34px;font-size:12.5px;padding:0 10px;flex:none}
.notice{border-radius:12px;padding:11px 12px;font-size:13px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line2);background:var(--card2)}
.notice.info{background:rgba(124,196,255,.08);border-color:rgba(124,196,255,.3)}
.notice.warn{background:rgba(245,196,81,.08);border-color:rgba(245,196,81,.35)}
.notice .btn{flex:none}
/* header */
.hdr{padding:10px 0 4px}
.nav{width:34px;height:44px;border-radius:10px;font-size:26px;line-height:1;color:var(--muted)}
.nav:disabled{opacity:.2}
.streak{display:flex;align-items:center;gap:4px;font-weight:800;font-size:18px;color:#ffb35c;background:rgba(255,179,92,.1);padding:6px 10px;border-radius:12px}
.streak svg{width:18px;height:18px}
.streak small{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
/* xp bar */
.xpbar{position:sticky;top:0;z-index:5;margin:6px -16px 0;padding:9px 16px 10px;background:rgba(10,14,20,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.xpn{font-size:28px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.xpn.neg{color:var(--bad)}
.passchip{font-size:12.5px;font-weight:750;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--muted)}
.passchip.ok{background:rgba(61,220,151,.14);color:var(--good)}
.formula{font-size:12.5px;color:var(--muted);margin-top:1px}
.pbar{position:relative;height:6px;border-radius:6px;background:var(--card2);margin-top:7px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--good)}
.pbar b{position:absolute;top:-3px;width:2px;height:12px;background:var(--text);opacity:.55;border-radius:2px}
/* type picker */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.type{min-height:62px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.type b{font-size:12.5px;letter-spacing:.04em}.type span{font-size:10.5px;color:var(--muted)}
.type.on.t-NORMAL{border-color:var(--NORMAL);background:rgba(45,212,191,.13)}.type.on.t-NORMAL b{color:var(--NORMAL)}
.type.on.t-JAGA{border-color:var(--JAGA);background:rgba(167,139,250,.14)}.type.on.t-JAGA b{color:var(--JAGA)}
.type.on.t-PASCA{border-color:var(--PASCA);background:rgba(96,165,250,.14)}.type.on.t-PASCA b{color:var(--PASCA)}
.type.on.t-LIBUR{border-color:var(--LIBUR);background:rgba(251,191,36,.12)}.type.on.t-LIBUR b{color:var(--LIBUR)}
.type.sug:not(.on){border-style:dashed;border-color:var(--PASCA)}
/* sleep */
.sleep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 10px}
.step{width:54px;height:54px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);font-size:28px;line-height:1;flex:none}
.sv{font-size:14px;color:var(--muted);text-align:center}.sv b{display:block;font-size:30px;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chips.c7{grid-template-columns:repeat(7,1fr);gap:5px}.chips.c7 .cp{font-size:13.5px}
.sleeptot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px}
.sleeptot .hint{font-size:12px;color:var(--info);text-align:right}
.cp{min-height:42px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);font-weight:650;font-size:14px}
.cp.on{background:var(--accent);color:#0a0e14;border-color:transparent}
.pill{font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--card2);white-space:nowrap}
.pill.hi{background:rgba(61,220,151,.15);color:var(--good)}.pill.mid{color:var(--text)}.pill.lo{background:rgba(245,196,81,.13);color:var(--warn)}.pill.vlo{background:rgba(255,107,107,.14);color:var(--bad)}
/* effects */
.fx{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fxc{font-size:12px;font-weight:650;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--card2)}
.fxc.bad{color:var(--bad);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
.fxc.warn{color:var(--warn);border-color:rgba(245,196,81,.4);background:rgba(245,196,81,.07)}
.fxc.info{color:var(--info);border-color:rgba(124,196,255,.35);background:rgba(124,196,255,.07)}
.fxc.muted{color:var(--muted)}
/* quests */
.q{border-top:1px solid var(--line)}
.quests .q:first-of-type{border-top:0}
.qbtn{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 0;text-align:left}
.qbtn.static{cursor:default}
.box{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--dim);display:grid;place-items:center;color:#06140d}
.box svg{width:20px;height:20px;stroke-width:3.2}
.q.on .box{background:var(--good);border-color:var(--good)}
.q.auto .box{border-style:dashed}
.q.auto.on .box{border-style:solid}
.q.late .box{border-color:var(--bad)}
.qt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.qn{font-weight:620;line-height:1.3}
.q.on .qn{color:var(--muted)}
.qm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.qx{font-weight:750;font-size:13px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.q.on .qx{color:var(--good)}
.q.locked{opacity:.55}
.q.locked .box{border-style:dotted;color:var(--muted)}
.q.locked .box svg{stroke-width:2;width:16px;height:16px}
.q.other .qn{color:var(--muted)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 10px 44px}
.yn button{min-height:42px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);font-weight:650;font-size:13.5px}
.yn button.on{background:rgba(61,220,151,.14);border-color:var(--good);color:var(--good)}
.yn button.on.bad{background:rgba(255,107,107,.13);border-color:var(--bad);color:var(--bad)}

/* ---------- migrasi skema ---------- */
// MIGRATIONS[n] mengubah data dari schemaVersion n ke n+1. Tambahkan di sini saat skema berubah.
const MIGRATIONS = {
  // v1 → v2: tidur siang (qailulah) ikut total tidur & pengali; nama bawaan disesuaikan (nama yang sudah diedit tidak disentuh).
  1: (d) => {
    for (const k of Object.keys(d.days || {})) if (d.days[k].nap === undefined) d.days[k].nap = 0;
    if (d.settings && d.settings.napCounts === undefined) d.settings.napCounts = true;
    (d.quests || []).forEach((q) => { if (q.id === 'q_sleep' && q.name === 'Tidur malam ≥6 jam') q.name = 'Total tidur ≥6 jam'; });
    (d.mutabaah || []).forEach((m) => { if (m.id === 'm_qiyam' && m.name === 'Qiyamul lail') m.name = 'Tahajjud sebelum Subuh'; });
  },
};
function migrate(d) {
  if (!d || typeof d !== 'object') throw new Error('Format tidak dikenal');
  if (typeof d.schemaVersion !== 'number') d.schemaVersion = 1;
  if (d.schemaVersion > SCHEMA_VERSION) throw new Error('Data dari versi aplikasi yang lebih baru (v' + d.schemaVersion + ')');
  while (d.schemaVersion < SCHEMA_VERSION) {
    const step = MIGRATIONS[d.schemaVersion];

    step(d);
    d.schemaVersion++;
  }

}
function fillDefaults(d) {

  for (const k of Object.keys(def)) if (d[k] === undefined) d[k] = def[k];
  for (const grp of ['settings', 'finance', 'targets', 'milestones']) {
    if (!d[grp] || typeof d[grp] !== 'object') d[grp] = def[grp];
    for (const k of Object.keys(def[grp])) if (d[grp][k] === undefined) d[grp][k] = def[grp][k];
  }
  d.quests.forEach(normQuest);
  for (const k of Object.keys(d.days)) normDay(d.days[k]);
  return d;
}

// Daftar quest yang berlaku untuk satu hari & tipe tertentu.

function raidWindow() {

/* ---------- keuangan ---------- */
function financeInfo() {
  const t = todayKey();
  const F = state.finance;
  const wk = Object.keys(state.weekly).sort();
  const debts = wk.filter((w) => state.weekly[w].debt != null).map((w) => ({ w, v: state.weekly[w].debt }));
  const bridges = wk.filter((w) => state.weekly[w].bridge != null).map((w) => ({ w, v: state.weekly[w].bridge }));
  const maxHP = F.debtInitial != null ? F.debtInitial : (debts.length ? debts[0].v : null);
  const curDebt = debts.length ? debts[debts.length - 1].v : F.debtInitial;
  const lastDmg = debts.length >= 2 ? debts[debts.length - 2].v - debts[debts.length - 1].v : null;
  let avg = null, lunas = null, onTrack = null;
  const recent = debts.slice(-9);
  if (recent.length >= 2) {
    const weeks = diffDays(recent[recent.length - 1].w, recent[0].w) / 7;
    if (weeks > 0) avg = (recent[0].v - recent[recent.length - 1].v) / weeks;
  }
  const paidOff = curDebt != null && curDebt <= 0;
  if (!paidOff && avg && avg > 0 && curDebt != null) {
    lunas = addDays(debts[debts.length - 1].w, Math.ceil(curDebt / avg) * 7);
    onTrack = lunas <= F.debtTargetDate;
  }
  const weeksToTarget = Math.max(1, diffDays(F.debtTargetDate, t) / 7);
  const needPerWeek = curDebt != null && curDebt > 0 ? curDebt / weeksToTarget : null;
  const curBridge = bridges.length ? bridges[bridges.length - 1].v : null;
  const bWeeks = Math.max(1, diffDays(F.bridgeTargetDate, t) / 7);
  const bNeed = F.bridgeTarget != null ? Math.max(0, F.bridgeTarget - (curBridge || 0)) / bWeeks : null;
  const bridgeReached = F.bridgeTarget != null && curBridge != null && curBridge >= F.bridgeTarget;
  const history = [];
  for (let i = 1; i < debts.length; i++) history.push({ w: debts[i].w, dmg: debts[i - 1].v - debts[i].v });
  return { maxHP, curDebt, lastDmg, avg, lunas, onTrack, needPerWeek, paidOff, curBridge, bNeed, bridgeReached, history, debts, bridges };
}

      { id: 'r60', label: '10K sub-60', done: sub60, prog: best10 ? 'Terbaik ' + secStr(best10) : 'Prediksi Riegel ' + secStr(riegel10k(best5 || T.run5kBaselineSec)) },

/* ---------- chapter ---------- */
function chapterSummary(ch) {
  const t = todayKey();
  const end = ch.end < t ? ch.end : t;
  const o = { days: 0, lolos: 0, xp: 0, sleepS: 0, sleepN: 0, jaga: 0, ot: 0, latP: 0, latD: 0, mutDone: 0, mutDays: 0, best: 0, span: Math.max(0, diffDays(end, ch.start) + 1) };
  let run = 0;
  for (let k = ch.start; k <= end; k = addDays(k, 1)) {
    const r = dayResult(k);
    const st = dayStatus(k);
    if (st === 'pass') { run++; o.best = Math.max(o.best, run); } else if (st === 'fail') run = 0;
    if (r.empty) continue;
    o.days++; if (r.pass) o.lolos++; o.xp += r.xp;
    if (r.effType === 'JAGA') o.jaga++;
    if (r.metrics) {
      if (r.metrics.sleepNJ != null) { o.sleepS += r.metrics.sleepNJ; o.sleepN++; }
      o.ot += r.metrics.ot; o.latP += r.metrics.latPlan; o.latD += r.metrics.latDone;
    }
    const raw = state.days[k];
    if (raw && raw.mut && state.mutabaah.length) { o.mutDays++; o.mutDone += state.mutabaah.filter((m) => raw.mut[m.id]).length; }
  }
  o.avgSleep = o.sleepN ? o.sleepS / o.sleepN : null;
  o.mutPct = o.mutDays && state.mutabaah.length ? o.mutDone / (o.mutDays * state.mutabaah.length) : null;
  return o;
}

  if (!parts.length) return '';

function radarSVG(lv) {
  const W = 300, c = 150, R = 96;
  const max = Math.max(5, Math.ceil(Math.max(...STATS.map((s) => lv[s]))));
  const pt = (i, v) => { const a = -Math.PI / 2 + (i * Math.PI) / 3; return [c + R * v * Math.cos(a), c + R * v * Math.sin(a)]; };
  let g = '';
  [0.25, 0.5, 0.75, 1].forEach((f) => { g += `<polygon points="${STATS.map((_, i) => pt(i, f).map((x) => x.toFixed(1)).join(',')).join(' ')}" stroke="#263244" stroke-width="1" fill="none"/>`; });
  STATS.forEach((_, i) => { const [x, y] = pt(i, 1); g += `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#263244" stroke-width="1"/>`; });
  const poly = STATS.map((s, i) => pt(i, Math.max(0.03, lv[s] / max)).map((x) => x.toFixed(1)).join(',')).join(' ');
  g += `<polygon points="${poly}" fill="rgba(142,166,255,.22)" stroke="#8ea6ff" stroke-width="2"/>`;
  STATS.forEach((s, i) => {
    const [x, y] = pt(i, Math.max(0.03, lv[s] / max));
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--${s})" stroke="none"/>`;
    const [lx, ly] = pt(i, 1.24);
    g += `<text x="${lx.toFixed(1)}" y="${(ly - 3).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--${s})" stroke="none">${s}</text><text x="${lx.toFixed(1)}" y="${(ly + 11).toFixed(1)}" text-anchor="middle" font-size="11" fill="#8b98a9" stroke="none">Lv ${Math.floor(lv[s])}</text>`;
  });
  return `<svg class="radar" viewBox="0 0 ${W} ${W}" role="img" aria-label="Radar enam stat">${g}</svg>`;
}

function rewardsHTML(level) {

/* =========================================================
   LAYAR 3 — BOSS & MILESTONE
   ========================================================= */
function renderBoss() {
  const F = state.finance;
  const fin = financeInfo();
  const t = todayKey();
  let h = `<header class="hdr"><h1>Boss & Milestone</h1><div class="small muted">Lag measure: hasil, bukan sumber XP harian.</div></header>`;
  // Boss utang
  h += `<section class="card" id="bossCard"><div class="row between"><h2>Boss: Utang</h2><span class="chip">target HP 0 · ${fmtMY(F.debtTargetDate)}</span></div>`;
  if (fin.maxHP == null) {
    h += `<p class="small muted">Sisa utang belum diisi.</p><button class="btn block" data-act="goto" data-tab="set" data-sec="fin">Isi sisa utang di Setelan</button>`;
  } else {
    const hpPct = fin.maxHP > 0 ? clamp((fin.curDebt || 0) / fin.maxHP, 0, 1) * 100 : 0;
    h += `<div class="row between" style="margin:8px 0 6px"><span class="big">${rpS(fin.curDebt)}</span><span class="small muted">HP awal ${rpS(fin.maxHP)}</span></div>
      <div class="hp" aria-label="HP boss"><i style="width:${hpPct}%"></i></div>
      <div class="small" style="margin-top:8px">${fin.paidOff ? '<b class="good">Boss kalah. Utang lunas.</b>' : fin.lastDmg != null ? `Damage minggu terakhir: <b>${rpS(fin.lastDmg)}</b>` : 'Belum ada data damage (butuh ≥2 data mingguan).'}</div>`;
    if (!fin.paidOff) {
      h += `<div class="small" style="margin-top:4px">${fin.lunas ? `Proyeksi lunas: <b class="${fin.onTrack ? 'good' : 'bad'}">${fmtMonthYear(fin.lunas)}</b> (rata-rata ${rpS(fin.avg)}/minggu) — ${fin.onTrack ? 'sebelum target' : 'melewati target ' + Math.ceil(diffDays(fin.lunas, F.debtTargetDate) / 7) + ' minggu'}` : 'Proyeksi lunas: belum bisa dihitung (rata-rata pembayaran ≤ 0 atau data < 2 minggu).'}</div>
        ${fin.needPerWeek ? `<div class="small muted" style="margin-top:4px">Agar lunas ${fmtMY(F.debtTargetDate)}: ${rpS(fin.needPerWeek)}/minggu.</div>` : ''}`;
    }

      const maxD = Math.max(1, ...fin.history.map((x) => Math.abs(x.dmg)));
      h += `<div class="subhead">Riwayat damage</div>${fin.history.slice(-6).map((x) => `<div class="dmg"><span>${fmtDate(x.w, { wd: false })}</span><span><i style="width:${(Math.max(0, x.dmg) / maxD) * 100}%"></i></span><span style="text-align:right">${rpS(x.dmg)}</span></div>`).join('')}`;
    }
  }
  h += `<button class="btn block" data-act="finWeek">Perbarui angka minggu ini (2 angka)</button></section>`;
  // Shield Dana Jembatan
  h += `<section class="card" id="bridgeCard"><div class="row between"><h2>Shield: Dana Jembatan</h2><span class="chip">${fmtDate(F.bridgeTargetDate, { wd: false, year: true })}</span></div>`;
  if (F.bridgeTarget == null) h += `<p class="small muted">Target belum diisi.</p><button class="btn block" data-act="goto" data-tab="set" data-sec="fin">Isi target di Setelan</button>`;
  else {
    const pct = clamp((fin.curBridge || 0) / F.bridgeTarget, 0, 1) * 100;
    h += `<div class="row between" style="margin:8px 0 6px"><span class="big">${rpS(fin.curBridge || 0)}</span><span class="small muted">target ${rpS(F.bridgeTarget)}</span></div><div class="sh"><i style="width:${pct}%"></i></div>
      <div class="small" style="margin-top:8px">${fin.bridgeReached ? '<b class="good">Shield penuh. Hadiah berbiaya terbuka.</b>' : `${nf(pct)}% · butuh ${rpS(fin.bNeed)}/minggu sampai ${fmtDate(F.bridgeTargetDate, { wd: false })}`}</div>`;
  }
  h += `</section>`;
  // Milestone
  const ML = milestoneList();
  h += `<section class="card" id="milestones"><h2>Milestone</h2>${ML.list.map((m) => `<div class="ms ${m.done ? 'done' : ''}"><span class="msb">${m.done ? ICON.check : ''}</span><div style="flex:1;min-width:0"><div style="font-weight:620">${esc(m.label)}</div><div class="tiny muted">${m.done ? 'Tercapai ' + fmtDate(m.done, { wd: false, year: true }) : esc(m.prog)}</div></div>${m.manual === 'sr' ? `<button class="btn sm" data-act="srToggle">${m.done ? 'Batal' : 'Tandai'}</button>` : ''}${m.manual === 'ielts' ? '<button class="btn sm" data-act="ieltsAdd">+ Mock</button>' : ''}</div>`).join('')}</section>`;
  // kalkulator
  h += `<section class="card calc"><h2>Kalkulator</h2>
    <div class="subhead">e1RM Epley = beban × (1 + rep/30)</div>
    <div class="grid2"><label class="small muted">Beban (kg)<input data-input="calc" id="cKg" inputmode="decimal" value="${ML.lastKg != null ? ML.lastKg : 60}" placeholder="60"></label><label class="small muted">Rep<input data-input="calc" id="cRep" inputmode="numeric" value="${ML.lastReps != null ? ML.lastReps : 5}"></label></div>
    <p class="small">e1RM: <output id="e1rmOut">–</output> <span class="tiny muted">${ML.bestE ? '· terbaik dari log ' + nfl(ML.bestE, 1) + ' kg' : ''}</span></p>
    <div class="subhead">Prediksi 10K (Riegel) = waktu 5K × 2^1,06</div>
    <label class="small muted">Waktu 5K (mm:ss)<input data-input="calc" id="c5k" value="${secStr(ML.best5 || state.targets.run5kBaselineSec)}"></label>
    <p class="small">10K: <output id="riegelOut">–</output></p>
    <p class="tiny muted">Bench 1 rep dihitung sebagai beban aktual (Epley melebih-lebihkan single).</p></section>`;
  // countdown
  h += `<section class="card"><div class="kv"><div class="kvi"><b>${Math.max(0, diffDays(state.targets.koasEnd, t))}</b><span>hari ke koas selesai (${fmtMY(state.targets.koasEnd)})</span></div><div class="kvi"><b>${Math.max(0, diffDays(state.targets.ukmppd, t))}</b><span>hari ke UKMPPD (${fmtMY(state.targets.ukmppd)})</span></div></div></section>`;
  setTimeout(updateCalc, 0);
  return h;
}
function updateCalc() {
  const kg = num(($('#cKg') || {}).value), rep = parseInt(($('#cRep') || {}).value, 10);
  const o1 = $('#e1rmOut');
  if (o1) o1.textContent = kg > 0 && rep > 0 && rep <= 30 ? nfl(e1rm(kg, rep), 1) + ' kg' : '–';
  const s5 = parseTime(($('#c5k') || {}).value);
  const o2 = $('#riegelOut');
  if (o2) o2.textContent = s5 ? secStr(riegel10k(s5)) + ' (pace ' + secStr(riegel10k(s5) / 10) + '/km)' : '–';
}

/* =========================================================
   LAYAR 4 — WEEKLY RAID
   ========================================================= */
function tileHTML(label, value, sub, cls) {
  return `<div class="tile ${cls || ''}"><div class="tl">${label}</div><div class="tv">${value}</div>${sub ? `<div class="ts">${sub}</div>` : ''}</div>`;
}
function delta(cur, prev, invert) {
  if (cur == null || prev == null) return '';
  const d = cur - prev;
  if (!d) return 'tetap';
  const good = invert ? d < 0 : d > 0;
  return `<span class="${good ? 'good' : 'bad'}">${d > 0 ? '+' : '−'}${rpS(Math.abs(d)).replace('Rp ', 'Rp ')}</span>`;
}
function raidTiles(m) {
  const s = S();
  const tCls = m.tJam > s.tentirMax ? 'ko' : (m.tJam >= s.tentirMin ? 'ok' : '');
  return `<div class="tiles" id="raidTiles">
    ${tileHTML('Tidur non-jaga (total)', m.avgSleep != null ? nfl(m.avgSleep, 2) + ' j' : '–', m.sleepN + ' hari' + (m.avgNight != null ? ' · malam ' + nfl(m.avgNight, 2) + ' + siang ' + nfl(m.avgNap, 2) : ''), m.avgSleep == null ? '' : m.avgSleep >= 6 ? 'ok' : 'ko')}
    ${tileHTML('Dana Jembatan', rpS(m.bridge), m.bridge == null ? 'belum diisi minggu ini' : delta(m.bridge, m.bridgePrev))}
    ${tileHTML('Tentir', nfl(m.tJam, 1) + ' j', `${m.tOk}/${m.tSesi} sesi ≤21.00 · kapasitas ${s.tentirMin}–${s.tentirMax} j${m.tJam > s.tentirMax ? ' · <b class="bad">lewat kapasitas</b>' : ''}`, tCls)}
    ${tileHTML('Lead dari konten', m.leads != null ? nf(m.leads) : '–', (m.leads == null ? 'belum diisi · ' : '') + m.konten + ' post minggu ini')}
    ${tileHTML('Jam karier', nfl(m.karier, 2) + ' j', 'target ≥' + nfl(s.careerMinHours) + ' j', m.karier >= s.careerMinHours ? 'ok' : 'ko')}
    ${tileHTML('Sesi latihan', m.latDone + '/' + m.latPlan, 'selesai vs rencana', m.latPlan && m.latDone >= m.latPlan ? 'ok' : '')}
    ${tileHTML('Proyek aktif', m.proyek + '/' + s.wipLimit, 'Main Quest (WIP)')}
    ${tileHTML('Sisa utang', rpS(m.debt), m.debt == null ? 'belum diisi minggu ini' : delta(m.debt, m.debtPrev, true))}
  </div>`;
}
function renderRaid() {

  let h = `<header class="hdr"><div class="row between"><h1>Weekly Raid</h1>${R.open && !done ? '<span class="timer" id="raidTimer"></span>' : ''}</div><div class="small muted">Minggu ${weekRange(ws)}${R.catchup ? ' · susulan (Senin)' : ''} · ≤30 menit</div></header>`;

  h += `<section class="card"><div class="lbl" style="margin-bottom:8px">Dashboard 8 angka</div>${raidTiles(m)}<p class="tiny muted" style="margin-top:8px">${m.rec} hari tercatat · ${m.lolos} lolos · ${m.ot} overtime · ${m.xp} XP harian</p></section>`;

    h += `<section class="card"><div class="row between"><div><div class="lbl">Backup</div><div class="small muted">Terakhir: ${lastExportText()}</div></div><button class="btn sm" data-act="export">Export JSON</button></div></section>`;
    h += `<button class="btn primary block" data-act="raidDone" id="raidDoneBtn">Selesaikan Raid +${s.raidXP} XP</button><div class="err" id="raidErr"></div>`;
  } else if (done) {
    h += `<section class="card"><div class="lbl">Prioritas minggu depan</div><ol class="small" style="margin:8px 0 0 18px">${(w.priorities || []).filter(Boolean).map((x) => `<li>${esc(x)}</li>`).join('')}</ol></section>`;
    h += `<section class="card"><div class="row between"><div><div class="lbl">Pengingat backup</div><div class="small muted">Terakhir: ${lastExportText()}</div></div><button class="btn sm" data-act="export">Export JSON</button></div></section>`;

  return h;
}

   LAYAR 5 — RIWAYAT
   ========================================================= */
function renderHistory() {
  const t = todayKey();
  if (!ui.histMonth) ui.histMonth = t.slice(0, 7);
  const month = ui.histMonth;
  const [y, mo] = month.split('-').map(Number);
  const first = month + '-01';
  const dim = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const lead = (weekday(first) + 6) % 7;
  let h = `<header class="hdr"><h1>Riwayat</h1></header>`;
  h += `<section class="card"><div class="row between"><button class="nav" data-act="histPrev" aria-label="Bulan sebelumnya">‹</button><h2>${MON_LONG[mo - 1]} ${y}</h2><button class="nav" data-act="histNext" ${month >= t.slice(0, 7) ? 'disabled' : ''} aria-label="Bulan berikutnya">›</button></div>`;
  h += `<div class="cal" id="cal">${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map((d) => `<div class="dh">${d}</div>`).join('')}`;
  for (let i = 0; i < lead; i++) h += '<div></div>';
  let rec = 0, lolos = 0, xp = 0;
  for (let d = 1; d <= dim; d++) {
    const k = `${month}-${pad(d)}`;
    const r = dayResult(k);
    let cls = 'c';
    if (k > t) cls += ' future';
    else if (r.empty) cls += ' empty';
    else { cls += ` t-${r.effType} ${r.pass ? 'pass' : 'fail'}`; rec++; if (r.pass) lolos++; xp += r.xp; }
    if (k === t) cls += ' today';
    h += `<button class="${cls}" data-act="dayDetail" data-key="${k}" ${k > t ? 'disabled' : ''} aria-label="${fmtDate(k)}${r.empty ? '' : ', ' + TYPE_INFO[r.effType].label + (r.pass ? ', lolos' : ', tidak lolos')}"><span>${d}</span>${r.shield ? `<i class="shi">${ICON.shield}</i>` : ''}</button>`;
  }
  h += `</div><div class="legend">${TYPES.map((tp) => `<span><i class="sw" style="background:var(--${tp})"></i>${TYPE_INFO[tp].label}</span>`).join('')}<span><i class="sw" style="border:1.5px solid var(--muted)"></i>garis = tidak lolos</span><span>${ICON.shield.replace('<svg', '<svg width="12" height="12"')} shield</span></div>
    <p class="small muted" style="margin-top:8px">Bulan ini: ${rec} hari tercatat · ${lolos} lolos · ${nf(xp)} XP</p></section>`;
  // log latihan
  h += woSectionHTML();
  // mutaba'ah
  if (state.mutabaah.length) {
    h += `<section class="card"><div class="row between"><div class="lbl">Mutaba'ah · 30 hari</div><span class="tiny muted">catatan konsistensi, bukan skor</span></div>`;
    state.mutabaah.forEach((m) => {
      let c = 0;
      const dots = [];
      for (let i = 29; i >= 0; i--) { const r = state.days[addDays(t, -i)]; const on = !!(r && r.mut && r.mut[m.id]); if (on) c++; if (i < 14) dots.push(on); }
      h += `<div class="rw"><div><div>${esc(m.name)}</div><div class="dots">${dots.map((o) => `<i class="${o ? 'on' : ''}"></i>`).join('')}</div></div><span class="small muted">${c}/30</span></div>`;
    });
    h += '</section>';
  }
  // chapter
  const chs = state.chapters.slice().sort((a, b) => (a.start < b.start ? 1 : -1)).filter((c) => c.start <= t);
  if (chs.length) h += `<section class="card"><div class="lbl">Chapter</div>${chs.map((c) => `<details class="chs" style="border-top:1px solid var(--line);padding:8px 0"><summary style="cursor:pointer"><b>${esc(c.name)}</b> <span class="tiny muted">${fmtDate(c.start, { wd: false })} – ${fmtDate(c.end, { wd: false, year: true })} · ${WEIGHTS[c.weight]}${c.end < t ? ' · selesai' : ' · berjalan'}</span></summary>${chapterSummaryHTML(c, true)}</details>`).join('')}</section>`;
  return h;
}

    <div class="kv" style="margin-top:10px"><div class="kvi"><b>${o.lolos}/${o.days}</b><span>hari lolos (dari ${o.span} hari)</span></div><div class="kvi"><b>${nf(o.xp)}</b><span>XP harian</span></div>

ACT.setType = (el) => {
  const type = el.dataset.type;
  const key = ui.viewKey;
  const cur = state.days[key];
  if (cur && cur.type === type) return;
  if (type === 'PASCA') {
    const prevK = addDays(key, -1);
    const pr = state.days[prevK];
    if (!pr || pr.type !== 'JAGA') {
      if (!isEditable(prevK)) { toast('PASCA-JAGA hanya bisa dipilih setelah hari JAGA.'); return; }
      const doIt = () => {
        act(() => { const p = ensureDay(prevK); delete p.frozen; p.type = 'JAGA'; const r = ensureDay(key); delete r.frozen; r.type = 'PASCA'; });
        toast('Kemarin ditandai JAGA.');
      };
      if (pr && pr.type) confirmSheet(`Kemarin tercatat ${TYPE_INFO[pr.type].label.toUpperCase()}. PASCA-JAGA hanya sah setelah JAGA. Ubah kemarin jadi JAGA?`, 'Ubah kemarin jadi JAGA', doIt);
      else doIt();
      return;
    }
  }
  editDay((r) => { r.type = type; });
};

function exportString() { return JSON.stringify(state, null, 2); }
// iPhone/iPad: unduhan blob tidak andal di aplikasi layar utama, jadi pakai lembar Bagikan (Simpan ke File / iCloud / Drive).
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function afterExport(msg) {
  meta.lastExportAt = nowMs();
  saveMeta();
  toast(msg);
  if (ui.tab === 'set' || ui.tab === 'raid') { if (!$('#sheet').classList.contains('open')) render(); }
}
ACT.export = async () => {
  const s = exportString();
  const name = `mbappe-os-${todayKey()}.json`;
  if (isIOS() && navigator.canShare && navigator.share) {
    let file = null;
    try { file = new File([s], name, { type: 'application/json' }); } catch (e) { file = null; }
    if (file && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Backup MBAPPE OS' });
        afterExport('Backup dibagikan. Pastikan tersimpan di File/iCloud.');
      } catch (e) {
        toast(e && e.name === 'AbortError' ? 'Backup dibatalkan.' : 'Bagikan gagal — pakai "Salin JSON".');
      }
      return;
    }
  }
  try {
    const blob = new Blob([s], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    afterExport('Backup diunduh.');
  } catch (e) {
    toast('Unduhan gagal — pakai "Salin JSON".');
  }
};
ACT.copyJson = () => {
  const s = exportString();
  const done = () => { meta.lastExportAt = nowMs(); saveMeta(); toast('JSON disalin. Simpan di tempat aman.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, () => openSheet(`<h2>Salin manual</h2><textarea readonly style="min-height:260px;font-size:11px">${esc(s)}</textarea><button class="btn block" data-act="closeSheet">Tutup</button>`));
  else openSheet(`<h2>Salin manual</h2><textarea readonly style="min-height:260px;font-size:11px">${esc(s)}</textarea><button class="btn block" data-act="closeSheet">Tutup</button>`);
};
function tryImport(text) {
  let obj;
  try {
    obj = JSON.parse(text);
    if (!obj || typeof obj !== 'object' || typeof obj.days !== 'object' || !Array.isArray(obj.quests)) throw new Error('Bukan file backup MBAPPE OS');
    migrate(obj);
    fillDefaults(obj);
  } catch (e) { toast('Import gagal: ' + e.message); return; }
  confirmSheet(`Timpa semua data dengan backup ini (${Object.keys(obj.days).length} hari)? Data sekarang akan hilang.`, 'Import & timpa', () => {
    state = obj;
    ui.viewKey = null;
    dirty();
    save();
    render();
    toast('Import berhasil.');
  }, true);
}

FORM.quest = (f) => {
  const fd = new FormData(f);
  const id = f.dataset.id;
  const existing = id ? questById(id) : null;
  const errs = [];
  const name = String(fd.get('name') || '').trim();
  if (!name) errs.push('Nama wajib diisi.');
  const q = existing ? JSON.parse(JSON.stringify(existing)) : normQuest({ id: uid('q'), name });
  q.name = name; q.stat = fd.get('stat'); q.size = fd.get('size');
  if (!q.sys) {
    q.types = fd.getAll('types');
    q.freq = fd.get('freq');
    q.tag = fd.get('tag') || '';
    if (!q.types.length) errs.push('Pilih minimal satu tipe hari.');
  }
  q.days = fd.getAll('days').map(Number);
  q.metric = fd.get('metric') || '';
  q.hours = clamp(num(fd.get('hours')) || 0, 0, 8);
  q.core = fd.get('core') === 'on';
  q.active = fd.get('active') === 'on';
  if (existing && existing.types.includes('PASCA') && (!q.active || !q.types.includes('PASCA')) && state.quests.filter((x) => x.types.includes('PASCA') && x.active && x.id !== q.id).length === 0) errs.push('PASCA-JAGA butuh minimal 1 quest pemulihan aktif.');
  if (errs.length) { $('#qErr').innerHTML = errs.map(esc).join('<br>'); return; }
  act(() => { if (existing) Object.assign(existing, q); else state.quests.push(q); });
  closeSheet();
  toast('Quest disimpan (0 XP).');
};
FORM.mech = (f) => {
  const fd = new FormData(f);
  const s = JSON.parse(JSON.stringify(S()));
  const errs = [];
  SIZES.forEach((z) => { s.xpSize[z] = num(fd.get('xp_' + z)); });
  const xs = s.xpSize;
  if (!(xs.kecil >= 1 && xs.kecil <= xs.sedang && xs.sedang <= xs.besar && xs.besar <= 50)) errs.push('XP harus 1 ≤ kecil ≤ sedang ≤ besar ≤ 50.');
  const tiers = [0, 1, 2, 3].map((i) => ({ min: i < 3 ? num(fd.get('tmin_' + i)) : 0, mult: num(fd.get('tmul_' + i)) }));
  if (tiers.some((t) => isNaN(t.min) || isNaN(t.mult))) errs.push('Isi semua angka pengali tidur.');
  else {
    if (!(tiers[0].min > tiers[1].min && tiers[1].min > tiers[2].min && tiers[2].min > 0)) errs.push('Ambang jam tidur harus menurun dan > 0.');
    if (!(tiers[0].mult >= tiers[1].mult && tiers[1].mult >= tiers[2].mult && tiers[2].mult >= tiers[3].mult)) errs.push('Pengali wajib naik seiring jam tidur — tidur lebih sedikit tidak boleh pernah lebih menguntungkan.');
    if (tiers.some((t) => t.mult < 0.3 || t.mult > 1.5)) errs.push('Pengali tidur 0,3–1,5.');
    if (tiers[3].mult > 1) errs.push('Pengali tidur terpendek tidak boleh > ×1,0.');
  }
  s.sleepTiers = tiers;
  MECH_FIELDS.forEach(([k, label, min, max]) => { const v = num(fd.get(k)); if (isNaN(v) || v < min || v > max) errs.push(`${label}: ${nfl(min)}–${nfl(max)}.`); else s[k] = v; });
  ['overtimeTokensPerWeek', 'shieldsPerWeek', 'wipLimit', 'backfillDays', 'statDivisor'].forEach((k) => { s[k] = Math.round(s[k]); });
  if (s.pascaXP > s.dailyCap) errs.push('XP PASCA-JAGA tidak boleh melebihi batas harian.');
  if (s.tentirMin > s.tentirMax) errs.push('Kapasitas tentir min harus ≤ maks.');
  if (s.sleepQuestMin < s.sleepDebtBelow) errs.push('Minimal jam quest tidur harus ≥ ambang Sleep Debt.');
  s.worstCaseEmpty = fd.get('worstCaseEmpty') === 'on';
  s.napCounts = fd.get('napCounts') === 'on';
  s.mqSize = fd.get('mqSize');
  if (errs.length) { $('#mechErr').innerHTML = errs.map(esc).join('<br>'); return; }
  freezeLocked();
  ui.openSec = 'mech';
  act(() => { state.settings = s; });
  toast('Mekanika disimpan (0 XP).');
};
FORM.chapter = (f) => {
  const fd = new FormData(f);
  const id = f.dataset.id;
  const c = { name: String(fd.get('name') || '').trim(), start: fd.get('start'), end: fd.get('end'), weight: fd.get('weight') };
  const errs = [];
  if (!c.name) errs.push('Nama wajib diisi.');
  if (!c.start || !c.end || c.end < c.start) errs.push('Tanggal selesai harus ≥ tanggal mulai.');
  if (errs.length) { $('#chErr').innerHTML = errs.map(esc).join('<br>'); return; }
  ui.openSec = 'chapter';
  act(() => {
    if (id) { const ex = state.chapters.find((x) => x.id === id); Object.assign(ex, c); if (ex.end >= todayKey()) ex.summarySeen = false; }
    else state.chapters.push(Object.assign({ id: uid('ch'), summarySeen: false }, c));
  });
  closeSheet();
  toast('Chapter disimpan (0 XP).');
};
FORM.fin = (f) => {
  const fd = new FormData(f);
  const errs = [];
  const band = String(fd.get('ieltsBand') || '').trim() === '' ? null : num(fd.get('ieltsBand'));
  if (band != null && (isNaN(band) || band < 1 || band > 9)) errs.push('Band IELTS 1–9.');
  const bench = num(fd.get('benchKg'));
  if (isNaN(bench) || bench < 20 || bench > 300) errs.push('Target bench 20–300 kg.');
  const run5 = parseTime(fd.get('run5k'));
  if (!run5) errs.push('Baseline 5K tidak valid (mm:ss).');
  if (errs.length) { $('#finErr').innerHTML = errs.map(esc).join('<br>'); return; }
  ui.openSec = 'fin';
  act(() => {
    const F = state.finance, T = state.targets;
    F.debtInitial = parseRp(fd.get('debtInitial'));
    F.bridgeTarget = parseRp(fd.get('bridgeTarget'));
    F.debtTargetDate = fd.get('debtTargetDate') || F.debtTargetDate;
    F.bridgeTargetDate = fd.get('bridgeTargetDate') || F.bridgeTargetDate;
    delete F.sample;
    T.ieltsBand = band; T.benchKg = bench; T.run5kBaselineSec = run5;
    T.koasEnd = fd.get('koasEnd') || T.koasEnd; T.ukmppd = fd.get('ukmppd') || T.ukmppd;
  });
  toast('Disimpan (0 XP).');
};
FORM.finWeek = (f) => {
  const fd = new FormData(f);
  act(() => { const w = ensureWeek(f.dataset.ws); w.debt = parseRp(fd.get('debt')); w.bridge = parseRp(fd.get('bridge')); });
  closeSheet();
  toast('Angka minggu ini tersimpan.');
};
FORM.ielts = (f) => {
  const fd = new FormData(f);
  const band = num(fd.get('band'));
  if (isNaN(band) || band < 1 || band > 9) { toast('Band 1–9.'); return; }
  act(() => { state.milestones.ielts.push({ date: fd.get('date') || todayKey(), band }); });
  closeSheet();
};
FORM.reward = (f) => {
  const fd = new FormData(f);
  const name = String(fd.get('name') || '').trim();
  if (!name) return;
  ui.openSec = 'reward';
  act(() => { state.rewards.push({ id: uid('rw'), name, cost: parseRp(fd.get('cost')) || 0 }); });
};
FORM.mutAdd = (f) => {
  const name = String(new FormData(f).get('name') || '').trim();
  if (!name) return;
  ui.openSec = 'mut';
  act(() => { state.mutabaah.push({ id: uid('m'), name }); });
};
FORM.mq = (f) => {
  const fd = new FormData(f);
  const id = f.dataset.id;
  const name = String(fd.get('name') || '').trim();
  const next = String(fd.get('next') || '').trim();
  if (!name) return;
  if (PHI_RE.test(next) || PHI_RE.test(name)) { toast('Hapus pola mirip identitas pasien dulu.'); return; }
  const full = state.mainQuests.filter((m) => m.status === 'aktif').length >= S().wipLimit;
  act(() => {
    if (id) { const m = state.mainQuests.find((x) => x.id === id); m.name = name; m.stat = fd.get('stat'); m.next = next; }
    else state.mainQuests.push({ id: uid('mq'), name, stat: fd.get('stat'), next, status: full ? 'beku' : 'aktif', createdAt: todayKey(), doneAt: null });
  });
  closeSheet();
  toast(!id && full ? 'WIP penuh — disimpan ke Beku.' : 'Main Quest disimpan (0 XP).');
};
FORM.wo = (f) => {
  const fd = new FormData(f);
  const kind = f.dataset.kind;
  const date = fd.get('date') || todayKey();
  const note = String(fd.get('note') || '').trim();
  const errs = [];
  if (date > todayKey()) errs.push('Tanggal tidak boleh di masa depan.');
  if (PHI_RE.test(note)) errs.push('Hapus pola mirip identitas pasien dari catatan.');
  let w;
  if (kind === 'bench') {
    const kg = num(fd.get('kg')), reps = parseInt(fd.get('reps'), 10), sets = parseInt(fd.get('sets'), 10) || null;
    if (!(kg > 0 && kg <= 400)) errs.push('Beban 1–400 kg.');
    if (!(reps >= 1 && reps <= 30)) errs.push('Rep 1–30.');
    w = { id: uid('wo'), date, kind, kg, reps, sets, note };
  } else {
    const km = num(fd.get('km')), sec = parseTime(fd.get('time'));
    if (!(km > 0 && km <= 100)) errs.push('Jarak 0–100 km.');
    if (!sec) errs.push('Waktu tidak valid (mm:ss).');
    w = { id: uid('wo'), date, kind, km, sec, runType: fd.get('runType'), note };
  }
  if (errs.length) { $('#woErr').innerHTML = errs.map(esc).join('<br>'); return; }
  act(() => { state.workouts.push(w); });
  toast(kind === 'bench' ? 'Log tersimpan · e1RM ' + nfl(e1rm(w.kg, w.reps), 1) + ' kg' : 'Log tersimpan · pace ' + secStr(w.sec / w.km) + '/km');
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });
document.addEventListener('submit', (e) => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); if (FORM[f.dataset.form]) FORM[f.dataset.form](f); });
document.addEventListener('toggle', (e) => { const d = e.target; if (d && d.matches && d.matches('details.set')) { if (d.open) ui.openSec = d.dataset.sec; else if (ui.openSec === d.dataset.sec) ui.openSec = null; } }, true);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet(); });
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); else render(); });

/* =========================================================
   INIT
   ========================================================= */
function init() {
  const qn = new URLSearchParams(location.search).get('now');
  if (qn && !isNaN(Date.parse(qn))) nowOverride = Date.parse(qn);
  let loaded = null;
  try {
    const probe = STORE_KEY + '-probe';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      try { loaded = fillDefaults(migrate(JSON.parse(raw))); } catch (e) {
        memoryMode = true;
        storageNote = 'Data tersimpan tidak bisa dibaca (' + e.message + '). Berjalan di memori; data lama tidak ditimpa. Import backup di Setelan.';
      }
    }
    try { const m = localStorage.getItem(META_KEY); if (m) meta = Object.assign(meta, JSON.parse(m)); } catch (e) { /* abaikan */ }
  } catch (e) {
    memoryMode = true;
    storageNote = 'Penyimpanan lokal tidak tersedia. Aplikasi berjalan di memori — data hilang saat tab ditutup. Export JSON secara berkala.';
  }
  if (loaded) state = loaded;
  else { state = defaultState(); makeSample(); }
  save();
  render();
}

// Hook untuk pengujian otomatis (tidak dipakai UI).
window.MBAPPE = {
  get state() { return state; },
  get memoryMode() { return memoryMode; },
  setNow(iso) { nowOverride = iso ? Date.parse(iso) : null; ui.viewKey = null; render(); },
  todayKey, computeDay: (k) => { dirty(); return computeDay(k); }, streakInfo: () => { dirty(); return streakInfo(); },
  totalXP: () => { dirty(); return totalXP(); }, exportString, render: () => render(), levelOf,
};

init();
})();
</script>
